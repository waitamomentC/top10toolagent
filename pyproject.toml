[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "top10tool"
version = "0.1.0"
description = "热搜 TOP10 智能工具 —— 基于 ReAct 范式的轻量级 Agent"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "openai>=1.30.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "duckduckgo-search>=7.0.0",
    "ddgs>=9.0.0",
    "rich>=13.0.0",
]

[project.scripts]
top10tool = "cli:main"

[tool.setuptools]
py-modules = ["cli", "main"]
packages = ["core", "gateway", "router", "tools", "models"]
